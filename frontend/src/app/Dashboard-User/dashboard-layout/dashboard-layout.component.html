<!-- Dashboard Container -->
<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <img src="../../../assets/logo-ensaj.png" alt="Logo">
      </div>
      <h3>SportEnsaj</h3>
    </div>
    
    <div class="sidebar-user">
      <div class="user-avatar">
        <img src="../../../assets/avatar.png" alt="User Avatar">
        <div class="loading-spinner" *ngIf="isLoading"></div>
      </div>
      <div class="user-info">
        <h4>{{ responsable.nom || 'Utilisateur inconnu' }}</h4>
        <p>Niveau: {{ responsable.niveau || 'Non défini' }}</p>
      </div>
    </div>
    
    <div class="sidebar-menu">
      <ul>
        <li [class.active]="isActive('/dashboard-user/tableau-de-bord')">
          <a routerLink="/dashboard-user/tableau-de-bord" routerLinkActive="active-link">
            <i class="fas fa-tachometer-alt"></i>
            <span>Tableau de bord</span>
          </a>
        </li>
        <li [class.active]="isActive('/dashboard-user/equipe')">
          <a routerLink="/dashboard-user/equipe" routerLinkActive="active-link">
            <i class="fas fa-users"></i>
            <span>Mes Équipes</span>
          </a>
        </li>
        <li [class.active]="isActive('/dashboard-user/club')">
          <a routerLink="/dashboard-user/club" routerLinkActive="active-link">
            <i class="fas fa-building"></i>
            <span>Mes Clubs</span>
          </a>
        </li>
        <li [class.active]="isActive('/dashboard-user/reservations-user')">
          <a routerLink="/dashboard-user/reservations-user" routerLinkActive="active-link">
            <i class="fas fa-calendar-check"></i>
            <span>Réservations</span>
          </a>
        </li>
        <li [class.active]="isActive('/dashboard-user/competitions')">
          <a routerLink="/dashboard-user/competitions" routerLinkActive="active-link">
            <i class="fas fa-trophy"></i>
            <span>Compétitions</span>
          </a>
        </li>
        <li [class.active]="isActive('/dashboard-user/parametres')">
          <a routerLink="/dashboard-user/parametres" routerLinkActive="active-link">
            <i class="fas fa-cog"></i>
            <span>Paramètres</span>
          </a>
        </li>
      </ul>
    </div>
    
    <div class="sidebar-footer">
      <a href="#" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
        <span>Déconnexion</span>
      </a>
    </div>
  </div>
  
  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Top Navbar -->
    <div class="top-navbar">
      <div class="navbar-left">
        <button class="menu-toggle">
          <i class="fas fa-bars"></i>
        </button>
        <div class="search-box">
          <input type="text" placeholder="Rechercher...">
          <i class="fas fa-search"></i>
        </div>
      </div>
      
      <div class="navbar-right">
        <div class="nav-item notification">
          <i class="fas fa-bell"></i>
          <span class="badge">3</span>
        </div>
        <div class="nav-item message">
          <i class="fas fa-envelope"></i>
          <span class="badge">5</span>
        </div>
        <div class="nav-item profile">
          <img src="../../../assets/avatar.png" alt="Profile">
          <div class="dropdown-menu">
            <a routerLink="/dashboard-user/mon-profil" routerLinkActive="active-link" class="dropdown-item">
              <i class="fas fa-user"></i> Mon Profil
            </a>
            <a routerLink="/dashboard-user/parametres" routerLinkActive="active-link" class="dropdown-item">
              <i class="fas fa-cog"></i> Paramètres
            </a>
            <a href="#" class="dropdown-item">
              <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Contenu dynamique -->
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
