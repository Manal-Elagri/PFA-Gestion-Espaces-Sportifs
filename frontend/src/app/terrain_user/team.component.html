<section id="terrain">
<div class="title-center">
	<h2 class="title-with-icon">
	  <img src="../../assets/terrain-de-football.png" alt="Icon terrain" />
	  Terrains Sportifs
	</h2>
	<p>
	  Découvrez nos terrains sportifs de qualité, adaptés à différentes disciplines et disponibles pour vos entraînements et compétitions.
	</p>
  </div>
  
  <!-- Carousel dynamique -->
  <div class="carousel-container" *ngIf="terrains && terrains.length > 0">
	<div class="carousel-navigation">
	  <button class="nav-button prev-button" (click)="prevSlide()">
		<i class="fa-solid fa-chevron-left"></i>
	  </button>
	  <div class="carousel-wrapper">
		<div class="terrains-carousel">
		  <div class="terrain-item" *ngFor="let terrain of visibleTerrains">
			<div class="terrain-image">
			  <img [src]="terrain.imageURL || '../../assets/default-terrain.jpg'" alt="{{ terrain.nom }}" />
			  
			</div>
			<div class="terrain-name">
			  <h3>{{ terrain.nom }}</h3>
			</div>
		  </div>
		</div>
	  </div>
	  <button class="nav-button next-button" (click)="nextSlide()">
		<i class="fa-solid fa-chevron-right"></i>
	  </button>
	</div>
  </div>
  
  <!-- Aucun terrain -->
  <div *ngIf="terrains.length === 0" class="no-items">
	<p>Aucun terrain n'est disponible pour le moment.</p>
  </div>
  </section>
